{% extends 'base.html' %}

{% block title %}Announce New Project - CampusPulse AI{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 1rem auto;">
    <div class="card" style="border: 1px solid var(--border-glow);">
        <div class="card-header">
            <h2 class="card-title">🚀 Announce Innovation Project</h2>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Project Title</label>
                <input type="text" name="title" class="form-input" placeholder="e.g. AI-Based Traffic & Vehicle Congestion Monitor" required>
            </div>

            <div class="form-group">
                <label class="form-label">Required Skills Stack (Comma-separated)</label>
                <input type="text" name="required_skills" class="form-input" placeholder="e.g. Python, Computer Vision, React, Django, PostgreSQL" required>
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">AI will use these tokens to recommend students with complementary expertise.</div>
            </div>

            <div class="form-group">
                <label class="form-label">Project Description & Objectives</label>
                <textarea name="description" class="form-textarea" rows="4" placeholder="Describe the technical scope, campus impact, and deliverable targets..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Publish Project & Run Teammate Matcher ➔</button>
        </form>
    </div>
</div>
{% endblock %}
