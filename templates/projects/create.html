{% extends 'base.html' %}

{% block title %}Announce New Project - CampusPulse AI{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 1rem auto;">
    <div class="card" style="border: 1px solid var(--border-glow);">
        <div class="card-header">
            <h2 class="card-title" style="display:flex; align-items:center; gap:0.5rem;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--brand-electric);"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>Announce Innovation Project</h2>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Project Title</label>
                <input type="text" name="title" class="form-input" placeholder="e.g. AI-Based Traffic & Vehicle Congestion Monitor" required>
            </div>

            <div class="form-group">
                <label class="form-label">Required Skills Stack (Comma-separated)</label>
                <input type="text" name="required_skills" class="form-input" placeholder="e.g. Python, Computer Vision, React, Django, PostgreSQL" required>
                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">AI will use these tokens to recommend students with complementary expertise.</div>
            </div>

            <div class="form-group">
                <label class="form-label">Project Description & Objectives</label>
                <textarea name="description" class="form-textarea" rows="4" placeholder="Describe the technical scope, campus impact, and deliverable targets..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; display:flex; align-items:center; justify-content:center; gap:0.4rem;">
                <span>Publish Project & Run Teammate Matcher</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </form>
    </div>
</div>
{% endblock %}
